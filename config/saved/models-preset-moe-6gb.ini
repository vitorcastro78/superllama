; MoE on ~6GB VRAM â€” keep active experts small; rest on CPU via --n-cpu-moe
; Pick ONE model file that exists on the target machine.

[qwen-moe-6gb]
; Example: Qwen3 30B-A3B or similar MoE at IQ2/IQ3 (~local path)
; model = C:\Models\gguf\YOUR-MOE-IQ2_XXS.gguf
ctx-size = 8192
n-gpu-layers = 99
flash-attn = on
cache-type-k = turbo3
